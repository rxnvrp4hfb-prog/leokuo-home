<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="郭宸佑 Leo Kuo 的聯絡方式">
<title>Leo Kuo</title>
<style>
:root{
  --bg:#f6f2ec;
  --ink:#1d1d1f;
  --muted:#6f6a62;
  --card:rgba(255,255,255,.84);
  --border:rgba(29,29,31,.12);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 12%, rgba(6,199,85,.10), transparent 28%),
    radial-gradient(circle at 86% 18%, rgba(228,64,95,.10), transparent 30%),
    linear-gradient(145deg,#fbf8f1 0%,var(--bg) 55%,#ebe5dc 100%);
}
.card{
  width:min(440px,100%);
  padding:28px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--card);
  box-shadow:0 20px 70px rgba(55,45,31,.14);
  backdrop-filter:blur(18px);
}
.profile{
  display:grid;
  justify-items:center;
  text-align:center;
  gap:12px;
  padding:6px 0 24px;
  border-bottom:1px solid var(--border);
}
.avatar{
  width:84px;height:84px;border-radius:50%;
  display:grid;place-items:center;
  position:relative;
  background:#1d1d1f;color:#fff;
  font-size:25px;font-weight:900;
  overflow:hidden;
}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.avatar img[hidden]{display:none}
h1{margin:0;font-size:38px;line-height:1}
.subtitle{margin:0;color:var(--muted);font-size:16px}
.links{display:grid;gap:12px;padding-top:22px}
.link{
  display:grid;
  grid-template-columns:50px 1fr 22px;
  align-items:center;
  gap:14px;
  min-height:68px;
  padding:9px 14px 9px 9px;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(255,255,255,.75);
  color:inherit;
  text-decoration:none;
  transition:.18s ease;
}
.link:hover{
  transform:translateY(-2px);
  border-color:rgba(29,29,31,.22);
  background:#fff;
  box-shadow:0 8px 24px rgba(0,0,0,.07);
}
.icon{
  width:50px;height:50px;border-radius:12px;
  display:grid;place-items:center;
  overflow:hidden;
}
.icon img{width:30px;height:30px;display:block}
.line-icon{background:#06C755}
.instagram-icon{
  background:radial-gradient(circle at 32% 105%,#feda75 0 20%,#fa7e1e 28%,#d62976 52%,#962fbf 76%,#4f5bd5 100%);
}
.facebook-icon{background:#1877F2}
.email-icon{background:#EA4335}
.label{display:block;font-weight:800;line-height:1.2}
.value{display:block;margin-top:4px;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.arrow{color:var(--muted);font-size:23px;text-align:right}
footer{text-align:center;margin-top:22px;color:#9a958d;font-size:12px}
@media(max-width:430px){
  .card{padding:22px}
  .link{grid-template-columns:46px 1fr 18px}
  .icon{width:46px;height:46px}
}
</style>
</head>
<body>
<main class="card">
  <section class="profile">
    <div class="avatar">
      <span>LK</span>
      <img src="/avatar.jpg" alt="" onload="this.previousElementSibling.hidden=true" onerror="this.hidden=true">
    </div>
    <h1>Leo Kuo</h1>
    <p class="subtitle">郭宸佑</p>
  </section>

  <section class="links">

    <a class="link" href="https://line.me/ti/p/GGU72198eK" target="_blank" rel="noopener noreferrer">
      <span class="icon line-icon" aria-hidden="true">
        <img src="https://cdn.simpleicons.org/line/FFFFFF" alt="">
      </span>
      <span>
        <span class="label">LINE</span>
        <span class="value">leo20613</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="link" href="https://www.instagram.com/_yo7.24/" target="_blank" rel="noopener noreferrer">
      <span class="icon instagram-icon" aria-hidden="true">
        <img src="https://cdn.simpleicons.org/instagram/FFFFFF" alt="">
      </span>
      <span>
        <span class="label">Instagram</span>
        <span class="value">@_yo7.24</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="link" href="https://www.facebook.com/leo.kuo.5" target="_blank" rel="noopener noreferrer">
      <span class="icon facebook-icon" aria-hidden="true">
        <img src="https://cdn.simpleicons.org/facebook/FFFFFF" alt="">
      </span>
      <span>
        <span class="label">Facebook</span>
        <span class="value">Leo Kuo</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="link" href="mailto:leo20613@gmail.com">
      <span class="icon email-icon" aria-hidden="true">
        <img src="https://cdn.simpleicons.org/gmail/FFFFFF" alt="">
      </span>
      <span>
        <span class="label">Email</span>
        <span class="value">leo20613@gmail.com</span>
      </span>
      <span class="arrow">›</span>
    </a>

  </section>

  <footer>© 2026 Leo Kuo</footer>
</main>
</body>
</html>
