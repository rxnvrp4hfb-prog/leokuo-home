<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="郭宸佑 Leo Kuo 的聯絡方式。">
  <title>Leo Kuo</title>
  <style>
    :root{
      --bg:#f6f2ec;
      --ink:#1d1d1f;
      --muted:#6f6a62;
      --card:rgba(255,255,255,.82);
      --line-border:rgba(29,29,31,.12);
      --line-green:#06C755;
      --ig1:#833AB4;
      --ig2:#FD1D1D;
      --ig3:#FCAF45;
      --mail:#2f6fbb;
      font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      color:var(--ink);
      background:
        radial-gradient(circle at 16% 10%, rgba(31,143,102,.16), transparent 28%),
        radial-gradient(circle at 86% 18%, rgba(196,82,116,.13), transparent 30%),
        linear-gradient(145deg,#fbf8f1 0%,var(--bg) 55%,#ebe5dc 100%);
    }
    a{color:inherit;text-decoration:none}
    .page{
      display:grid;
      place-items:center;
      min-height:100vh;
      padding:32px 18px;
    }
    .card{
      width:min(100%,440px);
      padding:28px;
      border:1px solid var(--line-border);
      border-radius:12px;
      background:var(--card);
      box-shadow:0 20px 70px rgba(55,45,31,.14);
      backdrop-filter:blur(18px);
    }
    .profile{
      display:grid;
      justify-items:center;
      text-align:center;
      gap:14px;
      padding:8px 0 24px;
      border-bottom:1px solid var(--line-border);
    }
    .avatar{
      display:grid;
      place-items:center;
      width:84px;
      height:84px;
      border-radius:50%;
      background:#1d1d1f;
      color:#fff;
      font-size:25px;
      font-weight:900;
    }
    h1{
      margin:0;
      font-size:clamp(30px,8vw,42px);
      line-height:1;
    }
    .subtitle{
      margin:0;
      color:var(--muted);
      font-size:16px;
    }
    .links{
      display:grid;
      gap:12px;
      padding-top:22px;
    }
    .link{
      display:grid;
      grid-template-columns:48px 1fr 24px;
      align-items:center;
      gap:14px;
      min-height:66px;
      padding:10px 14px 10px 10px;
      border:1px solid var(--line-border);
      border-radius:10px;
      background:rgba(255,255,255,.74);
      transition:transform .16s ease,border-color .16s ease,background .16s ease;
    }
    .link:hover{
      transform:translateY(-2px);
      border-color:rgba(29,29,31,.24);
      background:#fff;
    }
    .icon{
      display:grid;
      place-items:center;
      width:48px;
      height:48px;
      border-radius:10px;
      color:#fff;
      overflow:hidden;
    }
    .icon svg{width:28px;height:28px;display:block}
    .line-icon{background:var(--line-green)}
    .instagram-icon{
      background:radial-gradient(circle at 30% 110%,var(--ig3) 0 25%,var(--ig2) 45%,var(--ig1) 75%);
    }
    .email-icon{background:var(--mail)}
    .label{
      display:block;
      font-weight:850;
      line-height:1.25;
    }
    .value{
      display:block;
      margin-top:3px;
      color:var(--muted);
      font-size:14px;
      line-height:1.35;
      overflow-wrap:anywhere;
    }
    .arrow{
      color:var(--muted);
      font-size:22px;
      text-align:right;
    }
    @media(max-width:430px){
      .page{padding:18px 12px}
      .card{padding:22px}
      .avatar{width:74px;height:74px;font-size:22px}
      .link{grid-template-columns:44px 1fr 18px;min-height:62px;gap:12px}
      .icon{width:44px;height:44px}
      .icon svg{width:26px;height:26px}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-label="Leo Kuo 聯絡方式">
      <div class="profile">
        <div class="avatar" aria-hidden="true">LK</div>
        <div>
          <h1>Leo Kuo</h1>
          <p class="subtitle">郭宸佑</p>
        </div>
      </div>

      <div class="links">
        <!-- LINE：直接開啟加好友連結 -->
        <a class="link" href="https://line.me/ti/p/GGU72198eK" target="_blank" rel="noopener noreferrer" aria-label="使用 LINE 聯絡 Leo Kuo">
          <span class="icon line-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img">
              <path fill="currentColor" d="M32 9C18.7 9 8 17.7 8 28.5c0 8.5 6.8 15.7 16.3 18.3.6.1 1.5.5 1.7 1.1.2.5.1 1.3.1 1.8l-.3 2.1c-.1.6-.5 2.5 2.2 1.4 2.7-1.1 14.4-8.5 19.7-14.5C51.3 34.8 56 31.8 56 28.5 56 17.7 45.3 9 32 9Z"/>
              <text x="32" y="34.5" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#06C755">LINE</text>
            </svg>
          </span>
          <span>
            <span class="label">LINE</span>
            <span class="value">leo20613</span>
          </span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>

        <!-- Instagram：直接開啟個人頁面 -->
        <a class="link" href="https://www.instagram.com/_yo7.24/" target="_blank" rel="noopener noreferrer" aria-label="前往 Leo Kuo 的 Instagram">
          <span class="icon instagram-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img" fill="none">
              <rect x="12" y="12" width="40" height="40" rx="12" stroke="currentColor" stroke-width="5"/>
              <circle cx="32" cy="32" r="10" stroke="currentColor" stroke-width="5"/>
              <circle cx="45" cy="19" r="3" fill="currentColor"/>
            </svg>
          </span>
          <span>
            <span class="label">Instagram</span>
            <span class="value">@_yo7.24</span>
          </span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>

        <!-- Email：直接開啟預設郵件 App -->
        <a class="link" href="mailto:leo20613@gmail.com" aria-label="寄 Email 給 Leo Kuo">
          <span class="icon email-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img" fill="none">
              <rect x="10" y="16" width="44" height="32" rx="5" stroke="currentColor" stroke-width="5"/>
              <path d="M13 20l19 15 19-15" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span>
            <span class="label">Email</span>
            <span class="value">leo20613@gmail.com</span>
          </span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
