<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="郭宸佑 Leo Kuo 的聯絡方式。">
  <title>Leo Kuo</title>
  <style>
    :root {
      --bg: #f6f2ec;
      --ink: #1d1d1f;
      --muted: #6f6a62;
      --card: rgba(255, 255, 255, 0.78);
      --line: rgba(29, 29, 31, 0.12);
      --accent: #1f8f66;
      --accent-2: #c45274;
      --accent-3: #2f6fbb;
      font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 10%, rgba(31, 143, 102, 0.16), transparent 28%),
        radial-gradient(circle at 86% 18%, rgba(196, 82, 116, 0.13), transparent 30%),
        linear-gradient(145deg, #fbf8f1 0%, var(--bg) 55%, #ebe5dc 100%);
      letter-spacing: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 32px 18px;
    }

    .card {
      width: min(100%, 440px);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: 0 20px 70px rgba(55, 45, 31, 0.14);
      backdrop-filter: blur(18px);
    }

    .profile {
      display: grid;
      justify-items: center;
      text-align: center;
      gap: 14px;
      padding: 8px 0 24px;
      border-bottom: 1px solid var(--line);
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #1d1d1f;
      color: #fff;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 42px);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    .links {
      display: grid;
      gap: 12px;
      padding-top: 22px;
    }

    .link {
      display: grid;
      grid-template-columns: 48px 1fr 24px;
      align-items: center;
      gap: 14px;
      min-height: 66px;
      padding: 10px 14px 10px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .link:hover {
      transform: translateY(-1px);
      border-color: rgba(29, 29, 31, 0.24);
      background: #fff;
    }

    .icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      color: #fff;
    }

    .line .icon {
      background: var(--accent);
    }

    .instagram .icon {
      background: var(--accent-2);
    }

    .phone .icon {
      background: var(--accent-3);
    }

    .icon svg {
      width: 23px;
      height: 23px;
    }

    .label {
      display: block;
      font-weight: 850;
      line-height: 1.25;
    }

    .value {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .arrow {
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
      text-align: right;
    }

    @media (max-width: 430px) {
      .page {
        padding: 18px 12px;
      }

      .card {
        padding: 22px;
      }

      .avatar {
        width: 74px;
        height: 74px;
        font-size: 22px;
      }

      .link {
        grid-template-columns: 44px 1fr 18px;
        min-height: 62px;
        gap: 12px;
      }

      .icon {
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>
<body>
  <!-- Update these three items when the final LINE, Instagram, and phone are ready. -->
  <script>
    window.LEO_CONTACT = {
      line: { href: "#", value: "LINE ID 待填" },
      instagram: { href: "#", value: "Instagram 待填" },
      phone: { href: "#", value: "電話待填" }
    };
  </script>

  <main class="page">
    <section class="card" aria-label="Leo Kuo 聯絡方式">
      <div class="profile">
        <div class="avatar" aria-hidden="true">LK</div>
        <div>
          <h1>Leo Kuo</h1>
          <p class="subtitle">郭宸佑</p>
        </div>
      </div>

      <div class="links">
        <a class="link line js-line" href="#" aria-label="使用 LINE 聯絡 Leo Kuo">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6.5 8.5h11M6.5 12h7M12 21c4.97 0 9-3.58 9-8s-4.03-8-9-8-9 3.58-9 8c0 2.17.97 4.14 2.55 5.58L5 22l3.5-1.58A10.15 10.15 0 0 0 12 21Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span>
            <span class="label">LINE</span>
            <span class="value js-line-value">LINE ID 待填</span>
          </span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>

        <a class="link instagram js-instagram" href="#" aria-label="前往 Leo Kuo 的 Instagram">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="3.5" width="17" height="17" rx="5" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.8" stroke="currentColor" stroke-width="2"/><path d="M17.4 6.9h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
          </span>
          <span>
            <span class="label">Instagram</span>
            <span class="value js-instagram-value">Instagram 待填</span>
          </span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>

        <a class="link phone js-phone" href="#" aria-label="撥打電話給 Leo Kuo">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M21 16.6v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.35 19.35 0 0 1-6-6A19.8 19.8 0 0 1 1.12 3.9 2 2 0 0 1 3.1 1.72h3a2 2 0 0 1 2 1.72c.13.96.35 1.9.66 2.8a2 2 0 0 1-.45 2.11L7.05 9.6a16 16 0 0 0 6 6l1.25-1.25a2 2 0 0 1 2.11-.45c.9.31 1.84.53 2.8.66A2 2 0 0 1 21 16.6Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span>
            <span class="label">電話</span>
            <span class="value js-phone-value">電話待填</span>
          </span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
      </div>
    </section>
  </main>

  <script>
    const contact = window.LEO_CONTACT;
    const bindings = [
      ["line", ".js-line", ".js-line-value"],
      ["instagram", ".js-instagram", ".js-instagram-value"],
      ["phone", ".js-phone", ".js-phone-value"]
    ];

    for (const [key, linkSelector, valueSelector] of bindings) {
      const item = contact[key];
      document.querySelectorAll(linkSelector).forEach((link) => {
        link.href = item.href;
      });
      document.querySelectorAll(valueSelector).forEach((node) => {
        node.textContent = item.value;
      });
    }
  </script>
</body>
</html>
